<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سكانر تسجيل الدخول</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Tahoma, Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      text-align: center;
    }
    .box {
      max-width: 420px;
      margin: 0 auto;
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
    }
    #reader {
      width: 100%;
      margin: 15px 0;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    .msg {
      padding: 12px;
      border-radius: 10px;
      background: #334155;
      margin-top: 12px;
      line-height: 1.6;
    }
    button {
      margin-top: 12px;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    input {
      padding: 9px;
      border-radius: 8px;
      border: 0;
      width: 65%;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>سكانر تسجيل حضور الضيوف</h2>
    <p>وجّه الكاميرا نحو باركود الضيف للتحقق وتسجيل الدخول ومنع التكرار.</p>
    <div id="reader"></div>
    <div id="msg" class="msg">جاري تشغيل الكاميرا...</div>
    <button id="nextBtn" style="display:none;" onclick="resumeScan()">مسح ضيف جديد</button>
    <div>
      <input id="phoneInput" type="text" placeholder="أدخل رقم الجوال يدوياً" />
      <button onclick="manualCheck()">تحقق</button>
    </div>
  </div>

  <script>
    const URL_API = "https://unslumbery-hypereutectoid-vinnie.ngrok-free.dev/webhook/scanner";
    const msgEl = document.getElementById("msg");
    const nextBtn = document.getElementById("nextBtn");
    let qr = null;
    let busy = false;

    function getPhone(str) {
      str = (str || "").trim();
      try {
        const u = new URL(str);
        if (u.searchParams.get("phone")) return u.searchParams.get("phone").trim();
      } catch (e) {}
      const m1 = str.match(/phone=([0-9]+)/i);
      if (m1) return m1[1];
      const m2 = str.match(/\d{8,15}/);
      return m2 ? m2[0] : "";
    }

    async function sendPhone(phone) {
      if (!phone || busy) return;
      busy = true;
      nextBtn.style.display = "none";
      try { if (qr && qr.isScanning) await qr.pause(true); } catch (e) {}
      msgEl.innerHTML = "جاري التحقق للرقم: " + phone;
      try {
        const res = await fetch(URL_API + "?phone=" + encodeURIComponent(phone), {
          headers: { "ngrok-skip-browser-warning": "true" }
        });
        const txt = (await res.text()).replace(/^"|"$/g, "").trim();
        msgEl.innerHTML = txt || "تم التحقق";
      } catch (e) {
        msgEl.innerHTML = "تعذر الاتصال بـ n8n / ngrok";
      }
      nextBtn.style.display = "inline-block";
    }

    async function resumeScan() {
      busy = false;
      nextBtn.style.display = "none";
      msgEl.innerHTML = "الكاميرا جاهزة للمسح...";
      try { if (qr) await qr.resume(); } catch (e) {}
    }

    function manualCheck() {
      const p = getPhone(document.getElementById("phoneInput").value) || document.getElementById("phoneInput").value.trim();
      busy = false;
      sendPhone(p);
    }

    qr = new Html5Qrcode("reader");
    qr.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 220 },
      (decoded) => sendPhone(getPhone(decoded)),
      () => {}
    ).then(() => {
      msgEl.innerHTML = "الكاميرا جاهزة للمسح";
    }).catch(() => {
      msgEl.innerHTML = "الكاميرا غير مفعلة — يمكنك التحقق بالرقم يدوياً بالأسفل";
    });
  </script>
</body>
</html>

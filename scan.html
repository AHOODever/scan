<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سكانر تسجيل حضور الضيوف</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 14px;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(160deg, #090d16, #172554);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: rgba(37, 99, 235, 0.2);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.4);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      color: #ffffff;
    }
    .desc {
      margin: 0 0 18px;
      font-size: 14px;
      line-height: 1.7;
      color: #cbd5e1;
    }
    .scanner-box {
      background: #020617;
      border: 2px dashed rgba(96, 165, 250, 0.5);
      border-radius: 16px;
      padding: 10px;
      overflow: hidden;
    }
    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }
    .status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.65;
      border: 1px solid transparent;
    }
    .status.info {
      background: rgba(59, 130, 246, 0.14);
      border-color: rgba(59, 130, 246, 0.4);
      color: #bfdbfe;
    }
    .status.success {
      background: rgba(22, 163, 74, 0.18);
      border-color: rgba(34, 197, 94, 0.5);
      color: #bbf7d0;
    }
    .status.error {
      background: rgba(220, 38, 38, 0.18);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fecaca;
    }
    .btn {
      margin-top: 14px;
      width: 100%;
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }
    .btn:hover { background: #1d4ed8; }
    .manual-box {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(148, 163, 184, 0.18);
      display: flex;
      gap: 8px;
    }
    .manual-input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: #020617;
      color: #fff;

<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سكانر تسجيل الدخول</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 14px;
      font-family: Tahoma, Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      text-align: center;
    }
    .box {
      max-width: 420px;
      margin: 0 auto;
      background: #1e293b;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
    }
    h2 { margin: 0 0 8px; }
    p { margin: 0 0 14px; color: #cbd5e1; line-height: 1.6; font-size: 14px; }
    #reader {
      width: 100%;
      margin: 14px 0;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    .msg {
      padding: 13px;
      border-radius: 12px;
      background: #334155;
      margin-top: 12px;
      line-height: 1.65;
      word-break: break-word;
      font-size: 14px;
    }
    .msg.ok {
      background: rgba(22, 163, 74, 0.22);
      border: 1px solid rgba(34, 197, 94, 0.55);
      color: #bbf7d0;
    }
    .msg.warn {
      background: rgba(220, 38, 38, 0.22);
      border: 1px solid rgba(239, 68, 68, 0.55);
      color: #fecaca;
    }
    button {
      margin-top: 12px;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .manual {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 0;
      font-size: 14px;
      direction: ltr;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>سكانر تسجيل حضور الضيوف</h2>
    <p>وجّه الكاميرا نحو باركود الضيف للتحقق وتسجيل الدخول ومنع التكرار.</p>

    <div id="reader"></div>
    <div id="msg" class="msg">جاري تشغيل الكاميرا...</div>
    <button id="nextBtn" style="display:none;">مسح ضيف جديد</button>

    <div class="manual">
      <input id="phoneInput" type="text" inputmode="numeric" placeholder="رقم الجوال (مثال: 9665...)" />
      <button id="manualBtn" style="margin-top:0;">تحقق</button>
    </div>
  </div>

  <script>
    // ===== غيّر المسار إلى مسار الـ Webhook الجديد في n8n =====
    const URL_API = "https://unslumbery-hypereutectoid-vinnie.ngrok-free.dev/webhook/checkin-api";
    const TIMEOUT_MS = 15000;

    const msgEl = document.getElementById("msg");
    const nextBtn = document.getElementById("nextBtn");
    const manualBtn = document.getElementById("manualBtn");
    const phoneInput = document.getElementById("phoneInput");

    let qr = null;
    let busy = false;

    function setMessage(text, type = "") {
      msgEl.className = type ? `msg ${type}` : "msg";
      msgEl.textContent = text;
    }

    function toEnglishDigits(s) {
      return (s || "")
        .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
        .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
    }

    function extractGuestPhone(raw) {
      const str = toEnglishDigits(raw).trim();
      if (!str) return "";

      // 1) إذا كان الباركود رابط أو نص يحتوي على phone=
      try {
        const u = new URL(str);
        const p = u.searchParams.get("phone");
        if (p) return p.replace(/\D/g, "");
      } catch (e) {}

      const paramMatch = str.match(/(?:^|[?&])phone=([0-9]+)/i);
      if (paramMatch) return paramMatch[1];

      // 2) أو رقم جوال صريح (مثل 9665XXXXXXXX أو 05XXXXXXXX)
      const digitsOnly = str.replace(/\D/g, "");
      if (/^(9665\d{8}|05\d{8}|5\d{8})$/.test(digitsOnly)) {
        return digitsOnly;
      }

      return "";
    }

    async function sendPhone(phone) {
      if (busy) return;
      busy = true;
      manualBtn.disabled = true;
      nextBtn.style.display = "none";

      try {
        if (qr && qr.isScanning) await qr.pause(true);
      } catch (e) {}

      if (!phone) {
        setMessage("هذا الباركود لا يحتوي على رقم ضيف صالح، يرجى مسح تذكرة ضيف أو إدخال الرقم يدوياً.", "warn");
        busy = false;
        manualBtn.disabled = false;
        nextBtn.style.display = "inline-block";
        return;
      }

      setMessage("جاري التحقق للرقم: " + phone);

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

      try {
        const url = URL_API + "?phone=" + encodeURIComponent(phone);
        const res = await fetch(url, {
          headers: { "ngrok-skip-browser-warning": "true" },
          signal: controller.signal
        });

        if (!res.ok) throw new Error("HTTP " + res.status);

        const txt = (await res.text()).replace(/^"|"$/g, "").trim() || "تم التحقق";
        const isWarn =
          txt.includes("مسبقاً") ||
          txt.includes("مستخدم") ||
          txt.includes("غير مسجل") ||
          txt.toLowerCase().includes("already");

        setMessage(txt, isWarn ? "warn" : "ok");
      } catch (e) {
        console.error(e);
        setMessage(
          e.name === "AbortError"
            ? "انتهت مهلة الاتصال بالسيرفر"
            : "تعذر الاتصال بـ n8n / ngrok: " + e.message,
          "warn"
        );
      } finally {
        clearTimeout(timer);
        busy = false;
        manualBtn.disabled = false;
        nextBtn.style.display = "inline-block";
      }
    }

    async function resumeScan() {
      busy = false;
      nextBtn.style.display = "none";
      phoneInput.value = "";
      setMessage("الكاميرا جاهزة للمسح...");
      try {
        if (qr) await qr.resume();
      } catch (e) {
        console.error(e);
      }
    }

    function manualCheck() {
      if (busy) return;
      const phone = extractGuestPhone(phoneInput.value);
      sendPhone(phone);
    }

    nextBtn.addEventListener("click", resumeScan);
    manualBtn.addEventListener("click", manualCheck);
    phoneInput.addEventListener("keydown", e => {
      if (e.key === "Enter") manualCheck();
    });

    if (typeof Html5Qrcode === "undefined") {
      setMessage("تعذر تحميل مكتبة السكانر — تأكد من الإنترنت. يمكنك التحقق يدوياً.", "warn");
    } else {
      qr = new Html5Qrcode("reader");
      qr.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 220 },
        (decoded) => sendPhone(extractGuestPhone(decoded)),
        () => {}
      ).then(() => {
        setMessage("الكاميرا جاهزة للمسح");
      }).catch((err) => {
        console.error(err);
        setMessage("الكاميرا غير مفعلة — تأكد أن الصفحة على HTTPS وأنك سمحت بالكاميرا، أو تحقق بالرقم يدوياً.");
      });
    }
  </script>
</body>
</html>
